name: visual-vending

x-runtime: &runtime
  image: ${VENDING_GPU_IMAGE:-visual-vending-runtime:local}
  pull_policy: never
  restart: unless-stopped
  working_dir: /workspace
  entrypoint: ["/opt/conda/bin/python"]
  volumes:
    - .:/workspace:ro
    - ./data:/workspace/data
    - ${VENDING_MODEL_DIR:-./models}:/workspace/models:ro
    - ${VENDING_RUNTIME_DIR:-./runtime}:/workspace/runtime:ro
  environment: &runtime-env
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /workspace
    VENDING_ACCOUNTS_FILE: /workspace/data/accounts.json
    VENDING_DATA_DIR: /workspace/data
    VENDING_SIGNING_HOST: ${VENDING_SIGNING_HOST:-}
    VENDING_ASSET_HOSTS: ${VENDING_ASSET_HOSTS:-}
    VENDING_CALLBACK_HOSTS: ${VENDING_CALLBACK_HOSTS:-}
    VENDING_CALLBACK_DELAY: ${VENDING_CALLBACK_DELAY:-3}
    VENDING_CHECK_IMAGE_SIZE: ${VENDING_CHECK_IMAGE_SIZE:-1}
    VENDING_PUBLIC_URL: ${VENDING_PUBLIC_URL:-}
    SKU_LOG_DIR: /workspace/data/logs

services:
  api:
    <<: *runtime
    command: ["-m", "uvicorn", "vending.api:app", "--host", "0.0.0.0", "--port", "8768",
              "--ssl-certfile", "/workspace/data/tls.crt", "--ssl-keyfile", "/workspace/data/tls.key"]
    ports:
      - "${VENDING_BIND:-127.0.0.1}:${VENDING_PORT:-18768}:8768"
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8768/health',context=ssl._create_unverified_context(),timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-http:
    <<: *runtime
    command: ["-m", "uvicorn", "vending.api:app", "--host", "0.0.0.0", "--port", "8768"]
    ports:
      - "${VENDING_HTTP_BIND:-127.0.0.1}:${VENDING_HTTP_PORT:-18769}:8768"
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8768/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *runtime
    command: ["-m", "vending.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    environment:
      <<: *runtime-env
      SKU_HOI_TENSORRT_URL: http://detector:8770
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      EGL_PLATFORM: surfaceless
      __EGL_VENDOR_LIBRARY_FILENAMES: /workspace/runtime/gpu/10_nvidia.json
      PYTHONPATH: /workspace:/opt/sku-runtime/dino:/opt/sku-runtime/yolo:/opt/sku-runtime/mediapipe
    depends_on:
      detector:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: 1

  detector:
    image: ${VENDING_TENSORRT_IMAGE:-visual-vending-tensorrt:local}
    pull_policy: never
    restart: unless-stopped
    working_dir: /service
    group_add:
      - "1000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./services/tensorrt_detector:/service:ro
      - ./data/spool:/workspace/data/spool:ro
      - ${VENDING_MODEL_DIR:-./models}/tensorrt_detector:/models:ro
      - ${VENDING_RUNTIME_DIR:-./runtime}/tensorrt_detector/deps:/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8770/health',timeout=2))['ready']"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: 1
